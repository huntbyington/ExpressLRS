[env:DIY_2400_RX_STM32_DEV]
extends = env_common_stm32, radio_2400
platform = ststm32@^17.0.0 
board = nucleo_u575zi_q
framework = arduino

# Use build_unflags to remove the L432-specific offsets inherited from parent envs
build_unflags =
    -DVECT_TAB_OFFSET=0x4000U
    -DFLASH_APP_OFFSET=0x4000U
    -Wl,--defsym=FLASH_APP_OFFSET=16K

build_flags =
    ${env_common_stm32.build_flags}
    ${radio_2400.build_flags}
    ${common_env_data.build_flags_rx}
    -include target/DIY_2400_RX_STM32_DEV.h
    -D DEBUG_LOG
    -D HSI_VALUE=16000000U
    -D USE_HSI=1
    -O3
    # Explicitly set offsets to zero for Nucleo dev-kit testing
    -DVECT_TAB_OFFSET=0x0
    -DFLASH_APP_OFFSET=0x0
	-Wl,--defsym,ram_code_start=0
    -Wl,--defsym,ram_code_end=0
    -Wl,--defsym,ram_code=0

# Filter out the TX code for an RX build
build_src_filter = ${env_common_stm32.build_src_filter} -<tx_*.cpp>

upload_protocol = stlink
upload_port = 
monitor_port = 